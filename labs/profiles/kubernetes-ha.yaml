name: kubernetes-ha
description: "Cluster Kubernetes HA : 3 control planes (etcd empilé) + 3 workers ; kubeadm par défaut, Talos/RKE2 en variante."
budget:
  vcpu: 16
  ram_gb: 48
  disk_gb: 300
  overcommit_ratio_max: 2.0
vlans: [10, 30, 40]
images:
  - ubuntu_lts
variants: [kubeadm, talos, rke2, k3s]
components: [kubernetes, kubeadm, containerd, cilium, cilium_cli, hubble, gateway_api, metallb, envoy_gateway, argo_cd, flux, prometheus, grafana, loki, velero]
network:
  pod_cidr: 10.244.0.0/16
  service_cidr: 10.96.0.0/12
  api_vip: 10.10.40.220
  loadbalancer_pool: 10.10.40.200-10.10.40.219
  loadbalancer: "Cilium LB-IPAM (CiliumLoadBalancerIPPool) annoncé en BGP vers core-rtr01 (AS 65000, nœuds AS 65001, VLAN 40) ; MetalLB en variante (DECISIONS.md 2026-10-02)"
  kube_proxy: "absent (kubeadm --skip-phases=addon/kube-proxy) ; Cilium kubeProxyReplacement (DECISIONS.md 2026-10-02)"
can_run_with: [linux-base, ceph-3n]
vms:
  - name: kubernetes-ha-cp01
    vmid: 3021
    role: control plane
    vcpu: 2
    ram_gb: 6
    disk_gb: 40
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.21, overlay: 10.10.30.21, provider: 10.10.40.21}
  - name: kubernetes-ha-cp02
    vmid: 3022
    role: control plane
    vcpu: 2
    ram_gb: 6
    disk_gb: 40
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.22, overlay: 10.10.30.22, provider: 10.10.40.22}
  - name: kubernetes-ha-cp03
    vmid: 3023
    role: control plane
    vcpu: 2
    ram_gb: 6
    disk_gb: 40
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.23, overlay: 10.10.30.23, provider: 10.10.40.23}
  - name: kubernetes-ha-wk01
    vmid: 3031
    role: worker
    vcpu: 4
    ram_gb: 10
    disk_gb: 60
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.31, overlay: 10.10.30.31, provider: 10.10.40.31}
  - name: kubernetes-ha-wk02
    vmid: 3032
    role: worker
    vcpu: 2
    ram_gb: 10
    disk_gb: 60
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.32, overlay: 10.10.30.32, provider: 10.10.40.32}
  - name: kubernetes-ha-wk03
    vmid: 3033
    role: worker
    vcpu: 4
    ram_gb: 10
    disk_gb: 60
    storage: nvme
    nics: [10, 30, 40]
    ip: {mgmt: 10.10.10.33, overlay: 10.10.30.33, provider: 10.10.40.33}
