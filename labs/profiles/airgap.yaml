name: airgap
description: "VLAN 50 coupé d'Internet : une VM miroir (apt-mirror, Harbor en proxy cache, Nexus, CA) et un nœud déconnecté à installer depuis les miroirs."
budget:
  vcpu: 6
  ram_gb: 24
  disk_gb: 400
  overcommit_ratio_max: 2.0
vlans: [50]
images:
  - ubuntu_lts
  - rocky_linux
components: [harbor, nexus, step_ca, k3s]
network:
  egress: "bloqué au routeur virtuel ; seule core-mirror01 synchronise ses miroirs via mgmt, à la demande"
can_run_with: [linux-base, kubernetes-ha]
vms:
  - name: core-mirror01
    vmid: 5005
    role: miroirs (apt-mirror, Harbor proxy cache, Nexus) + BIND 9 faisant autorité pour airgap.lab.home.arpa, sans récursion
    vcpu: 4
    ram_gb: 16
    disk_gb: 60
    extra_disks_gb: [300]
    storage: nvme
    extra_disks_storage: hdd
    nics: [10, 50]
    ip: {mgmt: 10.10.10.5, airgap: 10.10.50.5}
  - name: airgap-ag01
    vmid: 5011
    role: nœud hors-ligne (installation depuis les miroirs, k3s déconnecté, images via Harbor)
    vcpu: 2
    ram_gb: 8
    disk_gb: 40
    storage: nvme
    nics: [50]
    ip: {airgap: 10.10.50.11}
