# fiches/kubernetes/01-kubectl-pods-namespaces — section 3, exercice autonome : un Pod, deux conteneurs.
# `web` sert une page sur le port 80 ; `client` l'interroge toutes les 5 s via localhost (réseau partagé du Pod).
# Les deux conteneurs partagent /shared (emptyDir) : la fiche 05 explique le pattern, ici on apprend à lire les logs.
apiVersion: v1
kind: Pod
metadata:
  name: duo
  namespace: shop
  labels:
    app: duo
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: web
      image: nginx:1.29
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html/shared
    - name: client
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            echo "requete $i: $(wget -qO- --timeout=2 http://localhost/ | head -c 40 | tr -d '\n')"
            echo "requete $i" >> /shared/journal.txt
            sleep 5
          done
      volumeMounts:
        - name: shared
          mountPath: /shared
