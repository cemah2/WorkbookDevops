# ServiceAccount dédié aux pods de workflow et droit minimal de l'executor (>= 3.4 : workflowtaskresults).
# Sans ce Role, le conteneur `main` réussit mais le conteneur `wait` ne peut pas publier le résultat :
# le nœud passe en Error. C'est la panne de break/gitops/02-argo-workflows-rbac.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wf-runner
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wf-executor
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wf-runner-executor
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: wf-runner
    namespace: argo
roleRef:
  kind: Role
  name: wf-executor
  apiGroup: rbac.authorization.k8s.io
