# Variante kubernetes-ha : exposition de l'UI argo-server par Gateway API (Cilium, DECISIONS.md 2026-10-02)
# et certificat cert-manager émis par la CA interne. Prérequis : argo-server lancé avec --secure=false
# (la Gateway termine le TLS ; par défaut argo-server sert lui-même du TLS auto-signé sur 2746).
# [non testé : pas de cluster dans la session de rédaction] — validé avec kubeconform seulement.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-ui
  namespace: argo
spec:
  secretName: argo-ui-tls
  dnsNames:
    - argo.apps.lab.home.arpa
  issuerRef:
    name: lab-root-ca
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argo
  namespace: argo
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: argo.apps.lab.home.arpa
      tls:
        mode: Terminate
        certificateRefs:
          - name: argo-ui-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo
  namespace: argo
spec:
  parentRefs:
    - name: argo
  hostnames:
    - argo.apps.lab.home.arpa
  rules:
    - backendRefs:
        - name: argo-server
          port: 2746
