# Paramètres noyau persistants (fiche securite/01, section 3). À copier dans /etc/sysctl.d/90-hardening.conf
# puis : sysctl --system. Vérifier : sysctl kernel.dmesg_restrict kernel.kptr_restrict fs.protected_regular
# dmesg réservé à root (les adresses noyau et les refus AppArmor n'ont rien à faire sous les yeux de tout le monde)
kernel.dmesg_restrict = 1
# adresses noyau masquées dans /proc (kallsyms…)
kernel.kptr_restrict = 2
# pas de ptrace entre processus d'un même utilisateur sauf parent -> enfant
kernel.yama.ptrace_scope = 1
# protections contre les liens et fichiers piégés dans les répertoires world-writable
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# réseau : anti-usurpation et pas de redirections ICMP acceptées
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
# ATTENTION : ne pas toucher à net.ipv4.ip_forward ici. Un nœud Kubernetes (fiches suivantes) en a besoin à 1.
