# Drop-in de durcissement de lecteur.service (fiche securite/01, section 4).
# À copier dans /etc/systemd/system/lecteur.service.d/hardening.conf puis : systemctl daemon-reload && systemctl restart lecteur
# Chaque directive ferme une porte ; systemd-analyze security lecteur.service mesure ce qui reste ouvert.
[Service]
# plus aucune élévation de privilèges possible (setuid, capacités de fichier)
NoNewPrivileges=yes
CapabilityBoundingSet=
# système de fichiers : tout en lecture seule sauf ce qui est listé, /home et /root invisibles, /tmp privé
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ReadOnlyPaths=/var/lib/lecteur
# noyau et cgroups hors d'atteinte
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
# pas de réseau : lecteur n'en a pas besoin
RestrictAddressFamilies=AF_UNIX
PrivateNetwork=yes
# espaces de noms, personnalité, temps réel, setuid/setgid : interdits
RestrictNamespaces=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
MemoryDenyWriteExecute=yes
# seccomp : seuls les appels système d'un service ordinaire, et surtout pas ceux des groupes privilégiés
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @mount @reboot @swap @obsolete
SystemCallErrorNumber=EPERM
UMask=0077
