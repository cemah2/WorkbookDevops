# Modules noyau interdits sur un serveur du lab (fiche securite/01, section 1).
# À copier dans /etc/modprobe.d/blacklist-lab.conf. `blacklist` empêche le chargement automatique ;
# `install <module> /bin/false` empêche aussi un `modprobe` explicite. Vérifier : modprobe -n -v usb-storage
blacklist usb-storage
install usb-storage /bin/false
blacklist firewire-core
install firewire-core /bin/false
blacklist cramfs
install cramfs /bin/false
blacklist squashfs
install squashfs /bin/false
