# Durcissement sshd (fiche securite/01, section 2). À copier dans /etc/ssh/sshd_config.d/00-hardening.conf.
# Le nom commence par 00 : dans sshd_config, la PREMIÈRE valeur rencontrée gagne, et le Include des drop-ins
# est en tête de fichier. Un 50-cloud-init.conf qui dirait PasswordAuthentication yes perdrait contre celui-ci.
# Avant de recharger : s'assurer que ton utilisateur est dans le groupe ops et que ta clé est en place,
# garder une session ouverte, tester avec `sshd -t` puis `sshd -T | grep -iE 'permitrootlogin|passwordauth|allowgroups'`.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowGroups ops
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitEmptyPasswords no
