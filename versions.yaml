# versions.yaml — SEULE source des versions du workbook (DECISIONS.md, 2026-10-02).
#
# Règles :
# - Aucun chapitre n'écrit une version en dur : il référence une clé de `components`.
# - Chaque entrée est vérifiée sur sa source officielle ; `verification` dit comment :
#     direct    : page/API officielle lue le jour indiqué
#     indirect  : source officielle bloquée depuis la session ; version lue sur un miroir
#                 officiel (git, registre de paquets, image officielle) ou une annonce relayée
#     unverified: impossible à vérifier ; `version` vaut null, à renseigner avant usage
# - Les lignes `# renovate:` sont lues par Renovate (customManagers regex, voir renovate.json)
#   et doivent précéder immédiatement la ligne `version:` qu'elles décrivent.
# - `channel` : stable | lts | exam (version imposée par un examen, ne pas suivre le dernier).

meta:
  checked_on: "2026-10-02"
  checked_by: "session d'amorçage (prompts/00-amorcage-depot.md)"
  next_review: "veille mensuelle (prompts/07-veille.md)"
  lab_target_summary: >
    Proxmox VE 9.2 / Ubuntu 24.04 LTS / Rocky 10.2 / Kubernetes 1.37 / Ceph 20.2 Tentacle /
    OpenStack 2026.1 Gazpacho (Kolla-Ansible 22) / OpenTofu 1.13 / OpenBao 2.7 / Helm 4 / OPNsense 26.7 / BIND 9.20.

